<svg viewBox="0 0 980 530" width="980" height="530" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How a change travels</title>
  <desc id="desc">You drag a note: the optimistic overlay moves it at once and presence relays a live preview. The op goes to the box's Durable Object, where Room checks and applies it, it is written to SQLite in the same event, and the output gate holds the reply until the write is durable. Then applied goes to everyone and the overlay settles. A rejected op reverts the guess.</desc>
  <style>
    svg { --rice: #f6f1e7; --raised: #fbf8f2; --sunk: #ece4d4; --ink: #1f1a17; --soft: #5b514a; --faint: #8f8378; --bamboo: #ddd1bb; --shu: #c8442f; }
    @media (prefers-color-scheme: dark) {
      svg { --rice: #171311; --raised: #211b18; --sunk: #120f0d; --ink: #efe7da; --soft: #b9ada0; --faint: #8f8378; --bamboo: #3a312b; --shu: #e0634d; }
    }
    text { font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .h { font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 15px; }
    .b { font-weight: 600; }
    .s { font-size: 12.5px; fill: var(--soft); }
    .n { font-family: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; }
    .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: var(--soft); }
    .ms { fill: var(--shu); }
    .bg { fill: var(--rice); }
    .frame { fill: var(--raised); stroke: var(--ink); stroke-width: 2; }
    .inner { fill: var(--sunk); }
    .gate { fill: var(--sunk); stroke: var(--shu); stroke-width: 2; }
    .faintbox { fill: var(--rice); stroke: var(--faint); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .life { stroke: var(--bamboo); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
    .dot { fill: none; stroke: var(--ink); stroke-width: 1.6; }
    .edge { stroke: var(--soft); stroke-width: 1.6; fill: none; }
    .edge-dot { stroke: var(--faint); stroke-width: 1.6; fill: none; stroke-dasharray: 3 4; }
    .edge-shu { stroke: var(--shu); stroke-width: 2; fill: none; }
    .arrow { fill: var(--soft); }
    .arrow-faint { fill: var(--faint); }
    .arrow-shu { fill: var(--shu); }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="arf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow-faint" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="arrow-shu" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="530" rx="22"/>

  <!-- lifelines -->
  <path class="life" d="M150 66 V512"/>
  <path class="life" d="M490 66 V512"/>
  <path class="life" d="M830 66 V512"/>

  <!-- lane headers -->
  <rect class="frame" x="40" y="18" width="220" height="48" rx="14"/>
  <text class="h" x="150" y="47" text-anchor="middle">You</text>
  <rect class="frame" x="380" y="18" width="220" height="48" rx="14"/>
  <text class="h" x="490" y="47" text-anchor="middle">Box Durable Object</text>
  <rect class="frame" x="720" y="18" width="220" height="48" rx="14"/>
  <text class="h" x="830" y="47" text-anchor="middle">Everyone else</text>

  <!-- 1 drag -->
  <rect class="inner" x="40" y="86" width="220" height="52" rx="10"/>
  <circle class="dot" cx="60" cy="112" r="10"/><text class="n" x="60" y="116" text-anchor="middle">1</text>
  <text class="b" x="78" y="107">Drag a note</text>
  <text class="s" x="78" y="126">the overlay moves it now</text>

  <!-- presence preview -->
  <text class="m" x="320" y="158" text-anchor="middle">presence · ≤ 20 Hz</text>
  <path class="edge-dot" d="M150 166 H822" marker-end="url(#arf)"/>
  <rect class="faintbox" x="720" y="180" width="220" height="52" rx="10"/>
  <text class="b" x="740" y="201">Your drag preview</text>
  <text class="s" x="740" y="220">relayed, never saved</text>

  <!-- op -->
  <text class="m" x="320" y="196" text-anchor="middle">op · move · opId</text>
  <path class="edge" d="M150 204 H482" marker-end="url(#ar)"/>

  <!-- 2 room -->
  <rect class="inner" x="380" y="222" width="220" height="52" rx="10"/>
  <circle class="dot" cx="400" cy="248" r="10"/><text class="n" x="400" y="252" text-anchor="middle">2</text>
  <text class="b" x="418" y="243">Room checks and applies</text>
  <text class="s" x="418" y="262">role, limits, settle() layout</text>

  <!-- 3 sqlite -->
  <rect class="inner" x="380" y="288" width="220" height="52" rx="10"/>
  <circle class="dot" cx="400" cy="314" r="10"/><text class="n" x="400" y="318" text-anchor="middle">3</text>
  <text class="b" x="418" y="309">Written to SQLite</text>
  <text class="s" x="418" y="328">in the same event</text>

  <!-- 4 gate -->
  <rect class="gate" x="380" y="354" width="220" height="52" rx="10"/>
  <circle class="dot" cx="400" cy="380" r="10"/><text class="n" x="400" y="384" text-anchor="middle">4</text>
  <text class="b" x="418" y="375">Output gate</text>
  <text class="s" x="418" y="394">holds replies until saved</text>

  <!-- rejected -->
  <rect class="faintbox" x="40" y="222" width="220" height="52" rx="10"/>
  <text class="b" x="60" y="243">Rejected instead?</text>
  <text class="s" x="60" y="262">the guess reverts, with a toast</text>
  <text class="m" x="320" y="240" text-anchor="middle">rejected</text>
  <path class="edge-dot" d="M376 248 H268" marker-end="url(#arf)"/>

  <!-- applied -->
  <text class="m ms" x="320" y="426" text-anchor="middle">applied · rev · upsert</text>
  <path class="edge-shu" d="M490 434 H158" marker-end="url(#ars)"/>
  <text class="m ms" x="660" y="426" text-anchor="middle">applied · rev · upsert</text>
  <path class="edge-shu" d="M490 434 H822" marker-end="url(#ars)"/>
  <circle cx="490" cy="434" r="4" fill="var(--shu)"/>

  <!-- 5 -->
  <rect class="inner" x="40" y="452" width="220" height="52" rx="10"/>
  <circle class="dot" cx="60" cy="478" r="10"/><text class="n" x="60" y="482" text-anchor="middle">5</text>
  <text class="b" x="78" y="473">Server store updated</text>
  <text class="s" x="78" y="492">the overlay settles to it</text>
  <rect class="inner" x="720" y="452" width="220" height="52" rx="10"/>
  <circle class="dot" cx="740" cy="478" r="10"/><text class="n" x="740" y="482" text-anchor="middle">5</text>
  <text class="b" x="758" y="473">Everyone sees it</text>
  <text class="s" x="758" y="492">same grid, same layout</text>
</svg>
